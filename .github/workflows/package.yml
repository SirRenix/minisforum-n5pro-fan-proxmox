# DKMS package: check driver/upstream against the upstream commit on GitHub,
# build from driver/upstream + driver/patches and run the installation test in
# Debian 13 on every push; on a release tag also publish a GitHub release with
# the .deb and its sha256. The accepted tag comes from packaging/UPSTREAM
# (packaging/version.sh): v0.2.1-1 (no fork version) or v0.2.1-sr1[-rc1].
name: package

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  upstream-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The tag is fetched from the upstream repository itself (not a raw URL by
      # commit id, which GitHub also serves for commits of forks), must resolve
      # to UPSTREAM_COMMIT, and the imported file set is fixed by IMPORT below.
      - name: driver/upstream is byte-identical to UPSTREAM_TAG = UPSTREAM_COMMIT
        env:
          IMPORT: driver-prototype/minisforum_n5_it5571.c driver-prototype/Makefile LICENSE LICENSES
        run: |
          . packaging/UPSTREAM
          git init -q /tmp/up
          git -C /tmp/up fetch -q --depth=1 "$UPSTREAM_REPO" "refs/tags/$UPSTREAM_TAG:refs/tags/$UPSTREAM_TAG"
          got=$(git -C /tmp/up rev-parse "refs/tags/$UPSTREAM_TAG^{commit}")
          [ "$got" = "$UPSTREAM_COMMIT" ] || { echo "::error::upstream $UPSTREAM_TAG is $got, packaging/UPSTREAM pins $UPSTREAM_COMMIT"; exit 1; }
          git -C /tmp/up ls-tree -r --name-only "$got" -- $IMPORT | LC_ALL=C sort > /tmp/want
          [ -s /tmp/want ] || { echo "::error::nothing to import at $got"; exit 1; }
          cd driver/upstream
          sha256sum --strict -c SHA256SUMS
          find . -type f ! -name SHA256SUMS ! -name ORIGIN | sed 's|^\./||' | LC_ALL=C sort > /tmp/have
          sed -n 's/^  \([^ ]*\) *blob [0-9a-f]\{40\}$/\1/p' ORIGIN | LC_ALL=C sort > /tmp/origin
          sed 's/^[0-9a-f]*  //' SHA256SUMS | LC_ALL=C sort > /tmp/sums
          diff -u /tmp/want /tmp/have || { echo "::error::driver/upstream file set differs from upstream ($IMPORT)"; exit 1; }
          diff -u /tmp/want /tmp/origin || { echo "::error::ORIGIN files: list differs from upstream"; exit 1; }
          diff -u /tmp/want /tmp/sums || { echo "::error::SHA256SUMS file list differs from upstream"; exit 1; }
          fail=0
          while read -r f; do
            if git -C /tmp/up cat-file blob "$got:$f" | cmp -s - "$f"; then echo "same  $f"; else echo "::error::$f differs from $UPSTREAM_TAG ($got)"; fail=1; fi
            blob=$(git -C /tmp/up rev-parse "$got:$f")
            awk -v f="$f" -v b="$blob" '$1 == f && $2 == "blob" && $3 == b { ok = 1 } END { exit !ok }' ORIGIN || { echo "::error::ORIGIN blob id of $f is not $blob"; fail=1; }
          done < /tmp/want
          [ "$fail" = 0 ]

  build-test:
    needs: upstream-check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: debian:trixie
    steps:
      - name: tools
        run: apt-get update -qq && apt-get install -y -qq patch ca-certificates >/dev/null
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: build
        run: bash packaging/build-deb.sh
      - name: installation test (hand install taken over, build, reinstall, remove)
        run: bash packaging/test/test-deb.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deb
          path: dist/
          retention-days: 7

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the release and upload assets — nothing else
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: deb
          path: dist
      - name: tag matches packaging/UPSTREAM
        run: |
          . packaging/version.sh
          [ "$GITHUB_REF_NAME" = "$GIT_TAG" ] || { echo "::error::tag $GITHUB_REF_NAME, packaging/UPSTREAM says $GIT_TAG (Debian $DEBVER)"; exit 1; }
          [ -f "dist/minisforum-n5-it5571-dkms_${DEBVER}_all.deb" ] || { echo "::error::no .deb for $DEBVER"; exit 1; }
          (cd dist && sha256sum -c ./*.sha256)
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          . packaging/version.sh
          deb=$(cd dist && ls ./*.deb | sed 's|^\./||')
          if [ -n "$FORK_VERSION" ]; then
            what="with the patches in [\`driver/patches/\`](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/driver/patches/series) (Debian/Proxmox fork, not affiliated with upstream)"
          else
            what="unchanged"
          fi
          pre=""
          [ -z "$FORK_RC" ] || pre="--prerelease"
          cat > notes.md <<EOF
          DKMS package ${DEBVER} of the IT5571 EC fan driver [ltdstudio/minisforum-n5-it5571](https://github.com/ltdstudio/minisforum-n5-it5571) ${UPSTREAM_TAG} (\`${UPSTREAM_COMMIT:0:7}\`), ${what}, for the Minisforum N5 Pro.

          \`\`\`
          apt install ./${deb}
          \`\`\`

          Builds the module for every kernel with headers, pulls the header meta-package (\`proxmox-default-headers\` or \`linux-headers-amd64\`), sets \`experimental_write=1\` and loads the module at boot. Takes over a hand installation made with \`deploy/install.sh\`. Verify with \`sha256sum -c ${deb}.sha256\`.
          EOF
          sed -i 's/^          //' notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes-file notes.md $pre
