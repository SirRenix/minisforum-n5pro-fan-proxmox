# n5-ectest and the shared module go/n5: format, vet, static analysis,
# vulnerability check, race tests, results.tsv current, f8a format
# compatibility, static build. On a tag ectest/vX.Y.Z: GitHub release with
# the linux/amd64 binary and its sha256.
name: ectest

on:
  push:
    branches: [main]
    tags: ["ectest/v*"]
    paths:
      - "go/n5/**"
      - "ectest/**"
      - "befunde/RESULTS.md"
      - "tools/validation-watch/n5-validation.conf.example"
      - "tools/f8a/**"
      - ".github/workflows/ectest.yml"
  pull_request:
    paths:
      - "go/n5/**"
      - "ectest/**"
      - "befunde/RESULTS.md"
      - "tools/validation-watch/n5-validation.conf.example"
      - "tools/f8a/**"
      - ".github/workflows/ectest.yml"

permissions:
  contents: read

env:
  STATICCHECK: honnef.co/go/tools/cmd/staticcheck@v0.8.1 # 2026.2.1
  GOVULNCHECK: golang.org/x/vuln/cmd/govulncheck@v1.8.0

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # pinned like the actions: golang:1.26-bookworm of 2026-10-28 (go1.26.10; go1.26.8 had GO-2026-6604)
    container: golang:1.26-bookworm@sha256:23ce71337b726608afb1bc00986e630a05034a87a87ea1fc2cd1ae5cf33387eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: tools
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          go install "$STATICCHECK"
          go install "$GOVULNCHECK"
      - name: gofmt
        run: |
          out=$(gofmt -l go ectest)
          [ -z "$out" ] || { echo "::error::not gofmt-formatted: $out"; exit 1; }
      - name: results.tsv generated from befunde/RESULTS.md
        run: |
          (cd go/n5 && go generate ./...)
          git diff --exit-code -- go/n5/hwstatus/results.tsv || { echo "::error::results.tsv is stale: run go generate ./... in go/n5"; exit 1; }
      - name: go/n5 vet, staticcheck, govulncheck, test -race
        working-directory: go/n5
        run: |
          go vet ./...
          staticcheck ./...
          govulncheck ./...
          go test -race -count=1 ./...
      - name: ectest vet, staticcheck, govulncheck, test -race
        working-directory: ectest
        run: |
          go vet ./...
          staticcheck ./...
          govulncheck ./...
          go test -race -count=1 -timeout 600s ./...
      - name: non-root paths (permission messages)
        working-directory: go/n5
        run: |
          setpriv --reuid=65534 --regid=65534 --clear-groups env HOME=/tmp GOCACHE=/tmp/gocache GOPATH=/tmp/gopath GOFLAGS=-buildvcs=false \
            go test -count=1 -run '^TestNotRootMessages$' -v ./identity | tee /tmp/nonroot.txt
          grep -q -- '--- PASS: TestNotRootMessages' /tmp/nonroot.txt
      - name: static build
        working-directory: ectest
        run: |
          case "$GITHUB_REF" in
            refs/tags/ectest/v*) ver=${GITHUB_REF_NAME#ectest/v} ;;
            *) ver=0.1.0-dev ;;
          esac
          commit=$(printf %.12s "$GITHUB_SHA")
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath \
            -ldflags="-s -w -X main.version=$ver -X main.commit=$commit" \
            -o dist/n5-ectest ./cmd/n5-ectest
          ./dist/n5-ectest version
          # tarball: binary, README (the units name it), systemd units
          pkg=n5-ectest-$ver-linux-amd64
          mkdir -p "dist/$pkg/contrib"
          cp dist/n5-ectest README.md "dist/$pkg/"
          cp -r contrib/systemd "dist/$pkg/contrib/"
          tar -C dist --owner=0 --group=0 -czf "dist/$pkg.tar.gz" "$pkg"
          rm -r "dist/$pkg"
          (cd dist && sha256sum n5-ectest "$pkg.tar.gz" > n5-ectest.sha256)
      - name: snapshot format compatible with f8a-snapshot.sh --diff (exit 0/1/2)
        run: |
          out=$(mktemp -d)
          (cd ectest && N5ECTEST_FORMAT_OUT="$out" go test -count=1 -run '^TestFormatFixtures$' ./internal/snapshot)
          fail=0
          while read -r a b want; do
            rc=0; bash tools/f8a/f8a-snapshot.sh --diff "$out/$a" "$out/$b" >/dev/null || rc=$?
            rc2=0; ectest/dist/n5-ectest diff "$out/$a" "$out/$b" >/dev/null || rc2=$?
            echo "$a $b: f8a $rc, n5-ectest $rc2, expected $want"
            [ "$rc" = "$want" ] && [ "$rc2" = "$want" ] || fail=1
          done < "$out/expected.txt"
          [ "$fail" = 0 ]
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: n5-ectest
          path: ectest/dist/
          retention-days: 7

  release:
    if: startsWith(github.ref, 'refs/tags/ectest/v')
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the release and upload assets, nothing else
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: n5-ectest
          path: dist
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist && sha256sum -c n5-ectest.sha256)
          printf 'n5-ectest %s, static linux/amd64 binary; the .tar.gz adds README and systemd units. Verify: `sha256sum -c n5-ectest.sha256`. Usage: ectest/README.md.\n' "${GITHUB_REF_NAME#ectest/v}" > notes.md
          gh release create "$GITHUB_REF_NAME" dist/n5-ectest dist/n5-ectest-*-linux-amd64.tar.gz dist/n5-ectest.sha256 --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes-file notes.md --prerelease
