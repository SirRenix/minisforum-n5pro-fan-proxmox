# /etc/n5-fand.conf — Kurven fuer n5-fand (Bash-Syntax, wird gesourced).
# Duty 0..255. Messpunkte 14.09.2026 (Duty -> RPM):
#   CPU:  85->2000  140->3120  179->3830  217->4445  255->5073
#   SSD:  74->2130  140->3280  179->3790  217->4230  255->4687
#   HDD:  87->1237  119->1850  140->2250  179->2725  217->3160  255->3540
INTERVAL=10
STEP_UP=40
STEP_DOWN=15

# CPU-Luefter (pwm1) <- k10temp Tctl
CPU_TMIN=45;  CPU_TMAX=80;  CPU_PMIN=85;  CPU_PMAX=255;  CPU_TCRIT=88
# SSD-Luefter (pwm2) <- max NVMe Composite (SN700 warnt ab 84 C); Idle 44-46 C
SSD_TMIN=48;  SSD_TMAX=65;  SSD_PMIN=74;  SSD_PMAX=255;  SSD_TCRIT=72
# HDD-Gruppe (pwm3) <- max drivetemp (WD: crit 60 C); Idle 39-42 C
HDD_TMIN=42;  HDD_TMAX=52;  HDD_PMIN=105; HDD_PMAX=255;  HDD_TCRIT=56
HDD_STOP_PWM=119

LOG_EVERY=30
DRYRUN=0