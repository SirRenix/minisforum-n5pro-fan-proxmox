# /etc/n5-fand.conf — Kurven fuer n5-fand (Bash-Syntax, wird gesourced).
# Nur ganze Zahlen. Ungueltige Werte -> Journal-Warnung, Alarm, eingebaute Defaults.
# Duty 0..255. Messpunkte 14.09.2026 (Duty -> RPM):
#   CPU:  85->2000  140->3120  179->3830  217->4445  255->5073
#   SSD:  74->2130  140->3280  179->3790  217->4230  255->4687
#   HDD:  87->1237  105->1650  140->2250  179->2725  217->3160  255->3540
INTERVAL=10          # s je Zyklus (2..120)
STEP_UP=40           # max. Aenderung nach oben je Zyklus
STEP_DOWN=15         # max. Aenderung nach unten je Zyklus

# CPU-Luefter (pwm1) <- k10temp Tctl. EC-Idle war 85.
CPU_TMIN=45;  CPU_TMAX=80;  CPU_PMIN=85;  CPU_PMAX=255;  CPU_TCRIT=88
# SSD-Luefter (pwm2) <- max NVMe Composite (SN700 warnt ab 84 C); Idle 44-46 C, EC-Idle 74.
SSD_TMIN=48;  SSD_TMAX=65;  SSD_PMIN=74;  SSD_PMAX=255;  SSD_TCRIT=72
# HDD-Gruppe (pwm3) <- max drivetemp (WD: crit 60 C). Bewusst schaerfer als der EC:
# ab 36 C Anstieg, 40 C -> 165 (~2600 RPM), 46 C -> Vollgas. Ziel: Platten <= 39 C.
HDD_TMIN=36;  HDD_TMAX=46;  HDD_PMIN=105; HDD_PMAX=255;  HDD_TCRIT=56
HDD_STOP_PWM=140     # HDD-Kanal beim Stopp/Absturz des Reglers (EC regelt ihn nicht mehr)

STALL_MIN_DUTY=60    # ab diesem Duty gilt RPM 0 als Stillstand
STALL_CYCLES=2       # ... nach so vielen Zyklen in Folge
STALE_CYCLES=18      # k10temp so viele Zyklen exakt gleich -> Sensor eingefroren
ALERT_COOLDOWN=1800  # s zwischen gleichen Alarmen
LOG_EVERY=30         # jeden n-ten Zyklus Statuszeile (0 = nie)
DRYRUN=0             # 1 = rechnen und loggen, nichts schreiben
